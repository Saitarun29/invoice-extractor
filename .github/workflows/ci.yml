name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Validate n8n workflow JSON
        run: node -e "for (const f of require('fs').readdirSync('n8n')) { const j = JSON.parse(require('fs').readFileSync('n8n/' + f, 'utf8')); if (!Array.isArray(j.nodes) || !j.connections) throw new Error(f + ' is not an n8n workflow'); console.log('ok', f, j.nodes.length, 'nodes'); }"
      - name: Syntax check
        run: for f in api/*.js assets/*.js scripts/*.mjs test/*.js; do node --check "$f"; done
